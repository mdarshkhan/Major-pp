{% extends 'admin/adminbase.html' %}

{% block content %}
<section id="admin-predictions" class="section">
  <div class="container section-title" data-aos="fade-up">
    <h2>All User Predictions</h2>
  </div>

  <div class="container" data-aos="fade" data-aos-delay="100">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <table class="table table-striped table-bordered" data-aos="fade-up" data-aos-delay="200">
          <thead class="table-primary">
            <tr>
              <th>User Input</th>
              <th>Predicted Label</th>
            </tr>
          </thead>
          <tbody>
            {% for prediction in predictions %}
            <tr>
              <td>{{ prediction.user_input }}</td>
              <td>{{ prediction.predicted_label }}</td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="4" class="text-center">No predictions found.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
{% endblock %}
